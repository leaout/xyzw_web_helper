# Render Blueprint —— 在 Render Dashboard 用 "Blueprint" 方式一键部署
# 用法：Render Dashboard -> New -> Blueprint -> 选择本仓库 -> 文件指向 render-backend/render.yaml
services:
  - type: web
    name: xyzw-backend
    runtime: node
    plan: free
    rootDir: render-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        sync: false # 在 Render 面板手动填入，不要写进仓库
      - key: SUPABASE_KEY
        sync: false
      - key: API_KEY
        generateValue: true # Render 自动生成强随机密钥；在面板复制它填到前端
    healthCheckPath: /health
